    <!-- Structured Data: Organization -->

    <!-- Structured Data: WebSite (enables sitelinks search in Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BGR Dev",
      "url": "https://bgrdev.com",
      "description": "Premium digital studio specializing in web design, UI/UX, branding, and full-stack development.",

        "@type": "SearchAction",
        "target": "https://bgrdev.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
